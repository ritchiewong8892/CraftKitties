<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CraftKittiesPOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDEEF3;
    --surface:#FFFFFF;
    --surface-soft:#FFF6FA;
    --primary:#E0568A;
    --primary-dark:#A83A64;
    --primary-light:#F7C6DC;
    --gold:#EFA45C;
    --text:#43263A;
    --text-muted:#93798C;
    --danger:#D2555A;
    --danger-light:#FBE4E4;
    --success:#4F9E76;
    --success-light:#E3F4EA;
    --border:#F3D6E3;
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow:0 8px 24px rgba(168,58,100,0.10);
    --shadow-sm:0 3px 10px rgba(168,58,100,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{ font-family:'Baloo 2',cursive; font-weight:600; margin:0; }
  button{ font-family:inherit; }
  input,select{ font-family:inherit; }

  .app{ max-width:1100px; margin:0 auto; padding:0 16px 60px; }

  /* ---------- Header ---------- */
  .hero{
    position:relative;
    background:linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
    background-image:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.07) 0px, rgba(255,255,255,0.07) 2px, transparent 2px, transparent 10px),
      linear-gradient(180deg,var(--primary) 0%, var(--primary-dark) 100%);
    color:#fff;
    border-radius:0 0 28px 28px;
    padding:22px 20px 26px;
    margin:0 0 18px;
    box-shadow:var(--shadow);
  }
  .hero-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .store-name-row{ display:flex; align-items:center; gap:8px; }
  .hero h1{ font-size:26px; color:#fff; }
  .edit-name-btn{
    background:rgba(255,255,255,0.22); border:none; color:#fff; width:28px; height:28px;
    border-radius:50%; cursor:pointer; font-size:13px; flex-shrink:0;
  }
  .hero-sub{ font-size:13.5px; opacity:0.85; margin-top:2px; }
  .stat-row{ display:flex; gap:10px; margin-top:16px; overflow-x:auto; padding-bottom:2px; }
  .stat-chip{
    background:rgba(255,255,255,0.16);
    border-radius:var(--radius-md);
    padding:9px 14px;
    min-width:88px;
    flex-shrink:0;
  }
  .stat-chip .num{ font-family:'Baloo 2'; font-size:19px; font-weight:600; }
  .stat-chip .label{ font-size:11.5px; opacity:0.85; margin-top:1px; }

  /* ---------- Tabs ---------- */
  .tabs{ display:flex; gap:8px; margin-bottom:18px; }
  .tab-btn{
    flex:1;
    background:var(--surface);
    border:1.5px solid var(--border);
    color:var(--text-muted);
    padding:11px 6px;
    border-radius:var(--radius-md);
    font-weight:700;
    font-size:13.5px;
    cursor:pointer;
    text-align:center;
    transition:all .15s ease;
  }
  .tab-btn.active{
    background:var(--primary);
    border-color:var(--primary);
    color:#fff;
    box-shadow:var(--shadow-sm);
  }

  .panel{ display:none; }
  .panel.active{ display:block; }

  /* ---------- Inventory grid ---------- */
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
    gap:14px;
  }
  .item-card{
    background:var(--surface);
    border-radius:var(--radius-md);
    overflow:hidden;
    box-shadow:var(--shadow-sm);
    border:1px solid var(--border);
    cursor:pointer;
    display:flex; flex-direction:column;
  }
  .item-photo{
    width:100%; aspect-ratio:1/1; object-fit:cover; background:var(--surface-soft);
  }
  .item-photo-placeholder{
    width:100%; aspect-ratio:1/1; background:linear-gradient(135deg,var(--primary-light),var(--surface-soft));
    display:flex; align-items:center; justify-content:center; font-size:34px;
  }
  .item-info{ padding:9px 10px 11px; }
  .item-name{ font-weight:800; font-size:13.5px; line-height:1.25; margin-bottom:3px; }
  .item-price{ color:var(--gold); font-weight:800; font-size:14px; }
  .item-stock{
    display:inline-block; margin-top:5px; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:20px;
  }
  .stock-ok{ background:var(--success-light); color:var(--success); }
  .stock-low{ background:#FFF1DE; color:#B87326; }
  .stock-out{ background:var(--danger-light); color:var(--danger); }

  .add-item-card{
    border:2px dashed var(--primary-light);
    border-radius:var(--radius-md);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--primary-dark); font-weight:800; font-size:13.5px;
    aspect-ratio:0.78; cursor:pointer; background:var(--surface-soft); gap:6px;
    min-height:150px;
  }
  .add-item-card .plus{ font-size:28px; line-height:1; }

  .section-title{ font-size:17px; margin:4px 0 12px; color:var(--primary-dark); }

  /* ---------- Checkout ---------- */
  .checkout-layout{ display:grid; grid-template-columns:1fr; gap:16px; }
  @media(min-width:820px){ .checkout-layout{ grid-template-columns:1.5fr 1fr; align-items:start; } }

  .qty-card{
    background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--border);
    padding:10px; display:flex; gap:10px; align-items:center; box-shadow:var(--shadow-sm);
  }
  .qty-card img, .qty-card .ph{
    width:52px; height:52px; border-radius:10px; object-fit:cover; flex-shrink:0;
    background:linear-gradient(135deg,var(--primary-light),var(--surface-soft));
    display:flex; align-items:center; justify-content:center; font-size:20px;
  }
  .qty-card .info{ flex:1; min-width:0; }
  .qty-card .name{ font-weight:800; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .qty-card .price{ color:var(--gold); font-weight:700; font-size:12.5px; }
  .stepper{ display:flex; align-items:center; gap:8px; }
  .step-btn{
    width:30px; height:30px; border-radius:50%; border:none; background:var(--primary-light);
    color:var(--primary-dark); font-size:17px; font-weight:800; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .step-btn:disabled{ opacity:0.35; cursor:not-allowed; }
  .step-btn.primary-fill{ background:var(--primary); color:#fff; }
  .step-qty{ min-width:18px; text-align:center; font-weight:800; font-size:14px; }

  .cart-panel{
    background:var(--surface); border-radius:var(--radius-lg); border:1px solid var(--border);
    padding:16px; box-shadow:var(--shadow); position:sticky; top:14px;
  }
  .cart-panel h3{ font-size:16px; color:var(--primary-dark); margin-bottom:10px; }
  .cart-line{ display:flex; justify-content:space-between; font-size:13px; padding:5px 0; }
  .cart-line .lname{ color:var(--text); }
  .cart-line .lval{ color:var(--text-muted); font-weight:700; }
  .cart-empty{ color:var(--text-muted); font-size:13px; text-align:center; padding:14px 0; }
  .divider{ border-top:1.5px dashed var(--border); margin:10px 0; }
  .field-label{ font-size:12px; font-weight:800; color:var(--text-muted); margin:10px 0 4px; display:block; }
  input[type=text],input[type=number]{
    width:100%; padding:9px 11px; border-radius:var(--radius-sm); border:1.5px solid var(--border);
    font-size:14px; background:var(--surface-soft); color:var(--text);
  }
  input:focus,select:focus{ outline:none; border-color:var(--primary); }
  .totals-row{ display:flex; justify-content:space-between; align-items:baseline; margin-top:4px; }
  .totals-row .tval{ font-family:'Baloo 2'; font-size:19px; font-weight:600; color:var(--gold); }
  .discount-note{ font-size:12px; color:var(--danger); margin-top:4px; }
  .btn{
    width:100%; padding:12px; border:none; border-radius:var(--radius-md);
    font-weight:800; font-size:14.5px; cursor:pointer; margin-top:12px;
  }
  .btn-primary{ background:var(--primary); color:#fff; box-shadow:var(--shadow-sm); }
  .btn-primary:disabled{ background:var(--primary-light); color:#fff; cursor:not-allowed; }
  .btn-ghost{ background:var(--surface-soft); color:var(--primary-dark); border:1.5px solid var(--border); }

  /* ---------- Sales book ---------- */
  .buyer-card{
    background:var(--surface); border-radius:var(--radius-md); border:1px solid var(--border);
    margin-bottom:10px; box-shadow:var(--shadow-sm); overflow:hidden;
  }
  .buyer-head{
    display:flex; justify-content:space-between; align-items:center; padding:13px 15px; cursor:pointer;
  }
  .buyer-head .bname{ font-weight:800; font-size:14.5px; }
  .buyer-head .bmeta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .buyer-head .btotal{ font-family:'Baloo 2'; color:var(--gold); font-size:16px; font-weight:600; text-align:right; }
  .buyer-body{ display:none; padding:0 15px 14px; }
  .buyer-body.open{ display:block; }
  .sale-row{ border-top:1px solid var(--border); padding:10px 0; }
  .sale-row .srow-head{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--text-muted); margin-bottom:5px; }
  .sale-row .sline{ font-size:13px; display:flex; justify-content:space-between; padding:2px 0; }
  .sale-row .sdiscount{ font-size:11.5px; color:var(--danger); margin-top:3px; }

  .footer-actions{ display:flex; justify-content:center; gap:22px; margin-top:26px; }
  .btn-text{ background:none; border:none; color:var(--primary-dark); font-weight:800; font-size:12.5px; cursor:pointer; padding:6px; text-decoration:underline; }
  .empty-state{ text-align:center; padding:50px 20px; color:var(--text-muted); }
  .empty-state .em-icon{ font-size:40px; margin-bottom:10px; }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(67,38,58,0.45); display:none;
    align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--surface); width:100%; max-width:480px; border-radius:24px 24px 0 0;
    padding:20px; max-height:88vh; overflow-y:auto;
  }
  @media(min-width:600px){
    .modal-overlay{ align-items:center; }
    .modal{ border-radius:var(--radius-lg); }
  }
  .modal h3{ color:var(--primary-dark); font-size:18px; margin-bottom:14px; }
  .photo-upload{
    width:100%; aspect-ratio:1.6/1; border-radius:var(--radius-md); border:2px dashed var(--primary-light);
    background:var(--surface-soft); display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:13px; font-weight:700; cursor:pointer; overflow:hidden; margin-bottom:12px;
  }
  .photo-upload img{ width:100%; height:100%; object-fit:cover; }
  .modal-actions{ display:flex; gap:10px; margin-top:16px; }
  .modal-actions .btn{ margin-top:0; }
  .btn-danger-ghost{ background:var(--danger-light); color:var(--danger); border:none; }
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--primary-dark); color:#fff; padding:11px 20px; border-radius:30px;
    font-weight:700; font-size:13.5px; box-shadow:var(--shadow); z-index:80; opacity:0; transition:opacity .25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; }
</style>
</head>
<body>

<div class="app">
  <div class="hero">
    <div class="hero-top">
      <div>
        <div class="store-name-row">
          <h1 id="storeName">CraftKitties</h1>
          <button class="edit-name-btn" onclick="editStoreName()">✎</button>
        </div>
        <div class="hero-sub">Handmade &amp; printed, one layer at a time 🌸</div>
      </div>
    </div>
    <div class="stat-row">
      <div class="stat-chip"><div class="num" id="statItems">0</div><div class="label">Items</div></div>
      <div class="stat-chip"><div class="num" id="statStock">0</div><div class="label">In stock</div></div>
      <div class="stat-chip"><div class="num" id="statSales">0</div><div class="label">Sales</div></div>
      <div class="stat-chip"><div class="num" id="statRevenue">$0</div><div class="label">Revenue</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="inventory" onclick="switchTab('inventory')">🎨 Inventory</button>
    <button class="tab-btn" data-tab="checkout" onclick="switchTab('checkout')">🧾 New sale</button>
    <button class="tab-btn" data-tab="sales" onclick="switchTab('sales')">📖 Sales book</button>
  </div>

  <!-- INVENTORY -->
  <div class="panel active" id="panel-inventory">
    <h2 class="section-title">Your items</h2>
    <div class="grid" id="inventoryGrid"></div>
  </div>

  <!-- CHECKOUT -->
  <div class="panel" id="panel-checkout">
    <h2 class="section-title">Ring up a sale</h2>
    <div class="checkout-layout">
      <div>
        <div class="grid" id="checkoutGrid" style="grid-template-columns:1fr;"></div>
      </div>
      <div class="cart-panel">
        <h3>🛒 Cart</h3>
        <div id="cartLines"><div class="cart-empty">No items selected yet</div></div>
        <div class="divider"></div>
        <div class="totals-row"><span>Gross total</span><span class="tval" id="grossTotal">$0.00</span></div>
        <label class="field-label">Buyer name</label>
        <input type="text" id="buyerInput" list="buyerList" placeholder="Who's buying?">
        <datalist id="buyerList"></datalist>
        <label class="field-label">Net price charged (after any discount)</label>
        <input type="number" id="netInput" step="0.01" min="0" placeholder="0.00">
        <div class="discount-note" id="discountNote" style="display:none;"></div>
        <button class="btn btn-primary" id="completeSaleBtn" onclick="completeSale()" disabled>Complete sale</button>
      </div>
    </div>
  </div>

  <!-- SALES BOOK -->
  <div class="panel" id="panel-sales">
    <h2 class="section-title">Sales by buyer</h2>
    <div id="salesBook"></div>
  </div>

  <div class="footer-actions">
    <button class="btn-text" onclick="exportBackup()">⤓ Export backup</button>
    <button class="btn-text" onclick="document.getElementById('restoreInput').click()">⤒ Restore backup</button>
    <input type="file" id="restoreInput" accept="application/json" style="display:none" onchange="importBackup(event)">
  </div>
</div>

<!-- Item modal -->
<div class="modal-overlay" id="itemModalOverlay">
  <div class="modal">
    <h3 id="itemModalTitle">Add an item</h3>
    <div class="photo-upload" id="photoUpload" onclick="document.getElementById('photoInput').click()">
      <span id="photoUploadLabel">📷 Tap to add a photo</span>
    </div>
    <input type="file" id="photoInput" accept="image/*" style="display:none" onchange="handlePhotoUpload(event)">
    <label class="field-label">Item name</label>
    <input type="text" id="itemNameInput" placeholder="e.g. Pink Dragon Keychain">
    <label class="field-label">Gross price ($ per unit)</label>
    <input type="number" id="itemPriceInput" step="0.01" min="0" placeholder="0.00">
    <label class="field-label">Stock on hand</label>
    <input type="number" id="itemStockInput" step="1" min="0" placeholder="0">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeItemModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveItem()">Save item</button>
    </div>
    <div class="modal-actions" id="deleteRow" style="display:none;">
      <button class="btn btn-danger-ghost" onclick="deleteItem()">Remove this item</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* Standalone storage: IndexedDB on the device (used when not running inside Claude) */
if(!window.storage){
  const dbp = new Promise((res,rej)=>{
    const rq = indexedDB.open('pos-db',1);
    rq.onupgradeneeded = ()=>rq.result.createObjectStore('kv');
    rq.onsuccess = ()=>res(rq.result);
    rq.onerror = ()=>rej(rq.error);
  });
  window.storage = {
    async get(k){
      const db = await dbp;
      return new Promise((res,rej)=>{
        const r = db.transaction('kv').objectStore('kv').get(k);
        r.onsuccess = ()=>res(r.result===undefined?null:{key:k,value:r.result});
        r.onerror = ()=>rej(r.error);
      });
    },
    async set(k,v){
      const db = await dbp;
      return new Promise((res,rej)=>{
        const t = db.transaction('kv','readwrite');
        t.objectStore('kv').put(v,k);
        t.oncomplete = ()=>res({key:k,value:v});
        t.onerror = ()=>rej(t.error);
      });
    }
  };
  if(navigator.storage && navigator.storage.persist){ navigator.storage.persist(); }
}

let items = [];
let sales = [];
let storeName = "CraftKitties";
let cart = {};
let editingItemId = null;
let pendingPhoto = null;

function fmt(n){ return '$' + (Math.round(n*100)/100).toFixed(2); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

async function loadAll(){
  try{
    const r = await window.storage.get('pos-items', false);
    items = r ? JSON.parse(r.value) : [];
  }catch(e){ items = []; }
  try{
    const r = await window.storage.get('pos-sales', false);
    sales = r ? JSON.parse(r.value) : [];
  }catch(e){ sales = []; }
  try{
    const r = await window.storage.get('pos-settings', false);
    if(r){ storeName = JSON.parse(r.value).storeName || storeName; }
  }catch(e){}
  document.getElementById('storeName').textContent = storeName;
  renderAll();
}

async function saveItems(){
  try{ await window.storage.set('pos-items', JSON.stringify(items), false); }
  catch(e){ showToast("Couldn't save — try again"); }
}
async function saveSales(){
  try{ await window.storage.set('pos-sales', JSON.stringify(sales), false); }
  catch(e){ showToast("Couldn't save — try again"); }
}
async function saveSettings(){
  try{ await window.storage.set('pos-settings', JSON.stringify({storeName}), false); }
  catch(e){}
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
}

function editStoreName(){
  const n = prompt('Name your shop:', storeName);
  if(n && n.trim()){
    storeName = n.trim();
    document.getElementById('storeName').textContent = storeName;
    saveSettings();
  }
}

/* ---------- Rendering ---------- */
function renderAll(){
  renderStats();
  renderInventory();
  renderCheckout();
  renderCart();
  renderSalesBook();
  renderBuyerList();
}

function renderStats(){
  const totalStock = items.reduce((s,i)=>s+i.stock,0);
  const revenue = sales.reduce((s,sa)=>s+sa.net,0);
  document.getElementById('statItems').textContent = items.length;
  document.getElementById('statStock').textContent = totalStock;
  document.getElementById('statSales').textContent = sales.length;
  document.getElementById('statRevenue').textContent = fmt(revenue);
}

function stockBadge(stock){
  if(stock<=0) return '<span class="item-stock stock-out">Out of stock</span>';
  if(stock<=3) return `<span class="item-stock stock-low">${stock} left</span>`;
  return `<span class="item-stock stock-ok">${stock} in stock</span>`;
}

function renderInventory(){
  const grid = document.getElementById('inventoryGrid');
  let html = '';
  items.forEach(it=>{
    html += `<div class="item-card" onclick="openItemModal('${it.id}')">
      ${it.photo ? `<img class="item-photo" src="${it.photo}">` : `<div class="item-photo-placeholder">🧩</div>`}
      <div class="item-info">
        <div class="item-name">${escapeHtml(it.name)}</div>
        <div class="item-price">${fmt(it.price)}</div>
        ${stockBadge(it.stock)}
      </div>
    </div>`;
  });
  html += `<div class="add-item-card" onclick="openItemModal(null)"><div class="plus">+</div>Add new item</div>`;
  grid.innerHTML = html;
}

function renderCheckout(){
  const grid = document.getElementById('checkoutGrid');
  if(items.length===0){
    grid.innerHTML = `<div class="empty-state"><div class="em-icon">🖨️</div>Add some items in Inventory first.</div>`;
    return;
  }
  let html='';
  items.forEach(it=>{
    const qty = cart[it.id]||0;
    html += `<div class="qty-card">
      ${it.photo ? `<img src="${it.photo}">` : `<div class="ph">🧩</div>`}
      <div class="info">
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="price">${fmt(it.price)} · ${it.stock} left</div>
      </div>
      <div class="stepper">
        <button class="step-btn" onclick="changeQty('${it.id}',-1)" ${qty<=0?'disabled':''}>–</button>
        <span class="step-qty">${qty}</span>
        <button class="step-btn primary-fill" onclick="changeQty('${it.id}',1)" ${qty>=it.stock?'disabled':''}>+</button>
      </div>
    </div>`;
  });
  grid.innerHTML = html;
}

function changeQty(id, delta){
  const it = items.find(i=>i.id===id);
  if(!it) return;
  const cur = cart[id]||0;
  const next = Math.max(0, Math.min(it.stock, cur+delta));
  if(next===0) delete cart[id]; else cart[id]=next;
  renderCheckout();
  renderCart();
}

function cartGross(){
  let g=0;
  for(const id in cart){
    const it = items.find(i=>i.id===id);
    if(it) g += it.price*cart[id];
  }
  return g;
}

function renderCart(){
  const linesEl = document.getElementById('cartLines');
  const ids = Object.keys(cart);
  if(ids.length===0){
    linesEl.innerHTML = `<div class="cart-empty">No items selected yet</div>`;
  } else {
    linesEl.innerHTML = ids.map(id=>{
      const it = items.find(i=>i.id===id);
      if(!it) return '';
      return `<div class="cart-line"><span class="lname">${escapeHtml(it.name)} × ${cart[id]}</span><span class="lval">${fmt(it.price*cart[id])}</span></div>`;
    }).join('');
  }
  const gross = cartGross();
  document.getElementById('grossTotal').textContent = fmt(gross);
  const netInput = document.getElementById('netInput');
  if(ids.length>0 && (netInput.dataset.touched!=='1')){
    netInput.value = gross.toFixed(2);
  }
  updateDiscountNote();
  const buyer = document.getElementById('buyerInput').value.trim();
  document.getElementById('completeSaleBtn').disabled = !(ids.length>0);
}

document.getElementById('netInput').addEventListener('input', function(){
  this.dataset.touched='1';
  updateDiscountNote();
});
document.getElementById('buyerInput').addEventListener('input', ()=>{});

function updateDiscountNote(){
  const gross = cartGross();
  const net = parseFloat(document.getElementById('netInput').value)||0;
  const note = document.getElementById('discountNote');
  const diff = gross-net;
  if(diff>0.004){
    note.style.display='block';
    note.textContent = `Discount applied: ${fmt(diff)} off`;
  } else {
    note.style.display='none';
  }
}

async function completeSale(){
  const ids = Object.keys(cart);
  if(ids.length===0) return;
  let buyer = document.getElementById('buyerInput').value.trim();
  if(!buyer) buyer = 'Walk-in';
  const gross = cartGross();
  let net = parseFloat(document.getElementById('netInput').value);
  if(isNaN(net)) net = gross;

  const lines = ids.map(id=>{
    const it = items.find(i=>i.id===id);
    return { itemId:id, name:it.name, qty:cart[id], unitPrice:it.price, lineGross: it.price*cart[id] };
  });

  ids.forEach(id=>{
    const it = items.find(i=>i.id===id);
    it.stock = Math.max(0, it.stock - cart[id]);
  });
  await saveItems();

  sales.push({
    id: uid(),
    date: new Date().toISOString(),
    buyer, lines, gross, net
  });
  await saveSales();

  cart = {};
  document.getElementById('buyerInput').value='';
  document.getElementById('netInput').value='';
  document.getElementById('netInput').dataset.touched='0';

  renderAll();
  showToast('Sale saved 🎉');
  switchTab('sales');
}

function renderBuyerList(){
  const buyers = [...new Set(sales.map(s=>s.buyer))];
  document.getElementById('buyerList').innerHTML = buyers.map(b=>`<option value="${escapeHtml(b)}">`).join('');
}

function renderSalesBook(){
  const el = document.getElementById('salesBook');
  if(sales.length===0){
    el.innerHTML = `<div class="empty-state"><div class="em-icon">📖</div>No sales recorded yet — ring one up in New sale.</div>`;
    return;
  }
  const byBuyer = {};
  sales.forEach(s=>{
    if(!byBuyer[s.buyer]) byBuyer[s.buyer] = {sales:[], net:0, gross:0};
    byBuyer[s.buyer].sales.push(s);
    byBuyer[s.buyer].net += s.net;
    byBuyer[s.buyer].gross += s.gross;
  });
  const buyerNames = Object.keys(byBuyer).sort((a,b)=>byBuyer[b].net-byBuyer[a].net);
  el.innerHTML = buyerNames.map((name,idx)=>{
    const g = byBuyer[name];
    const salesHtml = g.sales.slice().reverse().map(s=>{
      const d = new Date(s.date);
      const dateStr = d.toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
      const linesHtml = s.lines.map(l=>`<div class="sline"><span>${escapeHtml(l.name)} × ${l.qty}</span><span>${fmt(l.lineGross)}</span></div>`).join('');
      const disc = s.gross - s.net;
      return `<div class="sale-row">
        <div class="srow-head"><span>${dateStr}</span><span>${fmt(s.net)} paid</span></div>
        ${linesHtml}
        ${disc>0.004 ? `<div class="sdiscount">Discount: -${fmt(disc)}</div>` : ''}
      </div>`;
    }).join('');
    return `<div class="buyer-card">
      <div class="buyer-head" onclick="toggleBuyer(${idx})">
        <div><div class="bname">${escapeHtml(name)}</div><div class="bmeta">${g.sales.length} sale${g.sales.length>1?'s':''}</div></div>
        <div class="btotal">${fmt(g.net)}</div>
      </div>
      <div class="buyer-body" id="buyerBody${idx}">${salesHtml}</div>
    </div>`;
  }).join('');
}

function toggleBuyer(idx){
  document.getElementById('buyerBody'+idx).classList.toggle('open');
}

/* ---------- Item modal ---------- */
function openItemModal(id){
  editingItemId = id;
  pendingPhoto = null;
  const overlay = document.getElementById('itemModalOverlay');
  const title = document.getElementById('itemModalTitle');
  const photoUpload = document.getElementById('photoUpload');
  const deleteRow = document.getElementById('deleteRow');
  if(id){
    const it = items.find(i=>i.id===id);
    title.textContent = 'Edit item';
    document.getElementById('itemNameInput').value = it.name;
    document.getElementById('itemPriceInput').value = it.price;
    document.getElementById('itemStockInput').value = it.stock;
    photoUpload.innerHTML = it.photo ? `<img src="${it.photo}">` : `<span id="photoUploadLabel">📷 Tap to add a photo</span>`;
    pendingPhoto = it.photo || null;
    deleteRow.style.display='flex';
  } else {
    title.textContent = 'Add an item';
    document.getElementById('itemNameInput').value='';
    document.getElementById('itemPriceInput').value='';
    document.getElementById('itemStockInput').value='';
    photoUpload.innerHTML = `<span id="photoUploadLabel">📷 Tap to add a photo</span>`;
    deleteRow.style.display='none';
  }
  overlay.classList.add('open');
}
function closeItemModal(){
  document.getElementById('itemModalOverlay').classList.remove('open');
}

function handlePhotoUpload(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      const maxW = 500;
      const scale = Math.min(1, maxW/img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.72);
      document.getElementById('photoUpload').innerHTML = `<img src="${pendingPhoto}">`;
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

async function saveItem(){
  const name = document.getElementById('itemNameInput').value.trim();
  const price = parseFloat(document.getElementById('itemPriceInput').value);
  const stock = parseInt(document.getElementById('itemStockInput').value);
  if(!name){ showToast('Give the item a name'); return; }
  if(isNaN(price) || price<0){ showToast('Enter a valid price'); return; }
  if(isNaN(stock) || stock<0){ showToast('Enter a valid stock count'); return; }

  if(editingItemId){
    const it = items.find(i=>i.id===editingItemId);
    it.name=name; it.price=price; it.stock=stock; it.photo=pendingPhoto;
  } else {
    items.push({ id: uid(), name, price, stock, photo: pendingPhoto });
  }
  await saveItems();
  closeItemModal();
  renderAll();
  showToast('Item saved');
}

async function deleteItem(){
  if(!editingItemId) return;
  if(!confirm('Remove this item from your shop?')) return;
  items = items.filter(i=>i.id!==editingItemId);
  await saveItems();
  closeItemModal();
  renderAll();
  showToast('Item removed');
}

async function exportBackup(){
  const data = { storeName, items, sales, exportedAt: new Date().toISOString() };
  const dateStr = new Date().toISOString().slice(0,10);
  const fileName = `craftkitties-backup-${dateStr}.json`;
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});

  // On iPhone/iPad this opens the share sheet, which includes "Save to Files"
  try{
    const file = new File([blob], fileName, {type:'application/json'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Shop backup'});
      showToast('Backup shared');
      return;
    }
  }catch(err){
    if(err && err.name === 'AbortError') return;
  }

  // Fallback: normal download
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('Backup downloaded');
}

function importBackup(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async function(e){
    let data;
    try{ data = JSON.parse(e.target.result); }
    catch(err){ showToast("That file isn't a valid backup"); return; }
    if(!Array.isArray(data.items) || !Array.isArray(data.sales)){
      showToast("That file isn't a valid backup");
      return;
    }
    if(!confirm(`Replace all current data with this backup (${data.items.length} items, ${data.sales.length} sales)?`)) return;
    items = data.items;
    sales = data.sales;
    storeName = data.storeName || storeName;
    document.getElementById('storeName').textContent = storeName;
    await saveItems();
    await saveSales();
    await saveSettings();
    renderAll();
    showToast('Backup restored');
  };
  reader.readAsText(file);
  evt.target.value = '';
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

loadAll();
